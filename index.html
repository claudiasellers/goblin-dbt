<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple DBT tools for when things feel too big or complicated" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <title>DBT Tools</title>
    <!-- Paint the saved theme and palette before React mounts so there is no flash of the defaults.
         Reads the same profile cache UserProfileContext writes; skips if more than one account is cached. -->
    <script>
      (function () {
        try {
          var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf('goblin-dbt-profile-cache-') === 0; });
          if (keys.length !== 1) return;
          var p = JSON.parse(localStorage.getItem(keys[0]));
          if (!p) return;
          if (p.theme) document.documentElement.dataset.theme = p.theme;
          if (p.palette) document.documentElement.dataset.palette = p.palette;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
