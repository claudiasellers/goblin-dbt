# Tier-1 checks on every PR and push to main (D-12). No secrets: nothing here talks to
# Firebase or Neo4j. Tier 2 (emulators + local Neo4j) runs on Claudia's machine.
# Runs on the self-hosted runner on Claudia's Mac mini (label `goblin`; setup in docs/ci-runner.md),
# not GitHub's paid minutes. The Mac's own python3 runs the generator-freshness tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, goblin]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # no `cache:`: the Mac keeps ~/.npm between runs
      - name: Check the runner
        run: node scripts/ci/runner-check.mjs
      - name: Install (root)
        run: npm ci
      - name: Install (functions)
        run: npm ci --prefix functions
      - name: Build (frontend)
        run: npm run build
      - name: Build (functions)
        run: npm --prefix functions run build
      - name: Test
        run: npm test
      - name: Lint (no new errors)
        run: node scripts/ci/lint-budget.mjs
